name: Previsão OMIE

on:
  schedule:
    # 12:05 e 14:05 UTC: depois da publicação do OMIE (~11:45 UTC no inverno)
    - cron: "5 12 * * *"
    - cron: "5 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: previsao
  cancel-in-progress: false

jobs:
  previsao:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run.py
      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Previsão $(date -u +%Y-%m-%d\ %H:%M) UTC"
          git pull --rebase --autostash
          git push
